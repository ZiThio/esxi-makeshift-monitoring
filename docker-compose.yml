services:
  backend:
    build: ./backend
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
      - ./servers.local.json:/app/servers.local.json:ro
  frontend:
    build:
      context: ./vm-dashboard
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5001}
    ports:
      - "8081:80" # Maps port 8081 on your host to Nginx's port 80
    depends_on:
      - backend
    restart: unless-stopped